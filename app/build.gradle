plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'dev.victoys.down'
    compileSdk 35

    defaultConfig {
        applicationId "dev.victoys.down"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // gomobile 默认会产出多个 ABI，这里只保留 arm64 以控制 APK 体积。
        // 需要兼容 32 位设备时，把下面一行改成：abiFilters 'arm64-v8a', 'armeabi-v7a'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        jniLibs {
            // gomobile 产出的 .so 体积较大，保持压缩以减小 APK
            useLegacyPackaging = true
        }
        exclude 'META-INF/*'
    }

    // gomobile 生成的 AAR 放在 app/libs 下
    repositories {
        flatDir {
            dirs 'libs'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}
